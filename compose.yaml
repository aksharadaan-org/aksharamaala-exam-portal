name: aksharamaala-exam-portal
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: assessment
      POSTGRES_USER: exam_owner
      POSTGRES_PASSWORD: local_exam_only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - exam_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam_owner -d assessment"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  exam_data:
